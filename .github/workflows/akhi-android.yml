# AkhiBrowser for Android (arm64) built on GitHub: the direct APK and the Google Play bundle, with the extension and
# Premium merged. Signed with a throwaway key made in the run: the private signing job of akhi-branding signs them again
# with AkhiBrowser's key before anything is published, so the real key never reaches this public repository.
# Runs by hand (Run workflow), from akhi-release.yml and from firefox-sync.yml. Its output goes to a draft release of the
# private halgurdh/akhi-extension (output draft), not to the log or an artifact of this public repository.
# Needs the secret AKHI_SUBMODULES_TOKEN: read access to the submodules, read and write to the contents of
# halgurdh/akhi-extension.
name: AkhiBrowser Android

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The commit or tag to build
        type: string
        default: ""
      test_version:
        description: "A test build under this version, set in the run only (empty: the tree's version)"
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      test_version:
        type: string
        default: ""
    outputs:
      draft:
        description: The draft release in halgurdh/akhi-extension with the APK and the Play bundle
        value: ${{ jobs.build.outputs.draft }}

permissions:
  contents: read

env:
  TEST_VERSION: ${{ inputs.test_version }}
  MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
  MOZCONFIG: browser/branding/akhi/mozconfigs/akhi-android-arm64

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      draft: android-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 12G /swapfile && sudo chmod 600 /swapfile && sudo mkswap -q /swapfile && sudo swapon /swapfile
          df -h /
          free -m
          # memory and disk each minute, as GitHub stops the machine without a log when either runs out
          (while sleep 60; do echo "$(date +%T) disk $(df -h / | awk 'NR==2{print $4}') free, memory $(free -m | awk '/Mem/{print $7}')M free, swap $(free -m | awk '/Swap/{print $3}')M used"; done) &

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          token: ${{ secrets.AKHI_SUBMODULES_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test version
        if: env.TEST_VERSION != ''
        run: python3 browser/branding/akhi/tools/set_version.py "$TEST_VERSION"

      - name: Install the build tools
        run: |
          mkdir -p artifacts
          ./mach --no-interactive bootstrap --application-choice "GeckoView/Firefox for Android" > artifacts/bootstrap.log 2>&1 \
            || { tail -n 30 artifacts/bootstrap.log; exit 1; }
          # Gradle within 16 GB: the project asks 7 GB heap and 6 GB metaspace per daemon, and the machine stopped
          mkdir -p "$HOME/.gradle"
          printf '%s\n' \
            "org.gradle.jvmargs=-Xmx5g -Xms1g -XX:MaxMetaspaceSize=1536m -XX:+UseParallelGC -XX:ReservedCodeCacheSize=384m" \
            "kotlin.daemon.jvmargs=-Xmx2g" "org.gradle.workers.max=2" > "$HOME/.gradle/gradle.properties"
          (cd browser/extensions/akhi/webext && npm ci --no-audit --no-fund > /dev/null 2>&1 || npm install --no-audit --no-fund > /dev/null)

      - name: Build Gecko
        run: |
          echo "MOZ_BUILD_DATE=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
          # 3 jobs, not 4: with every core busy the runner ran out of memory and GitHub lost it during this step
          MOZ_BUILD_DATE=$(date -u +%Y%m%d%H%M%S) CARGO_BUILD_JOBS=2 ./mach build -j3 > artifacts/build.log 2>&1 \
            || { grep -nE "error|Error" artifacts/build.log | tail -n 40; exit 1; }

      - name: The throwaway signing key
        run: |
          keys="$RUNNER_TEMP/keys"
          mkdir -p "$keys"
          password=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$keys/test.jks" -alias test -keyalg RSA -keysize 2048 -validity 30 \
            -storepass "$password" -keypass "$password" -dname "CN=AkhiBrowser test build" > /dev/null 2>&1
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=test\nkeyPassword=%s\n' "$keys/test.jks" "$password" "$password" \
            > "$keys/signing.properties"
          echo "AKHI_SIGNING_PROPERTIES=$keys/signing.properties" >> "$GITHUB_ENV"

      - name: APK and Play bundle
        run: |
          version=$(cat browser/config/akhi_version.txt)
          ./mach gradle --stop > /dev/null 2>&1 || true
          pkill -f KotlinCompileDaemon || true
          free -m
          node browser/branding/akhi/tools/merge_akhi_extension.mjs artifacts/release-extension
          AKHI_EXTENSION_DIR="$PWD/artifacts/release-extension" ./mach gradle :fenix:assembleRelease > artifacts/gradle.log 2>&1 \
            || { grep -nE "FAILURE|error:|What went wrong" -A5 artifacts/gradle.log | tail -n 40; exit 1; }
          mkdir -p out
          cp obj-akhi-android-arm64/gradle/build/mobile/android/fenix/app/outputs/apk/release/fenix-arm64-v8a-release.apk \
            "out/AkhiBrowser-$version-android-arm64-v8a.apk"
          ./mach gradle --stop > /dev/null 2>&1 || true
          pkill -f KotlinCompileDaemon || true
          # lint passed for the APK; run again for the bundle it hung for over an hour
          mkdir -p "$HOME/.gradle/init.d"
          echo 'allprojects { tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false } }' \
            > "$HOME/.gradle/init.d/no-lint-vital.gradle"
          python3 browser/branding/akhi/tools/build_play.py --signing "$AKHI_SIGNING_PROPERTIES" > artifacts/play.log 2>&1 \
            || { tail -n 40 artifacts/play.log; exit 1; }
          cp artifacts/play-$version/*.aab artifacts/play-$version/*universal.apk out/

      - name: Check the APK
        run: |
          python3 - <<'PY' | tee artifacts/check.txt
          import pathlib, zipfile
          ext = pathlib.Path("artifacts/release-extension")
          apk = next(pathlib.Path("out").glob("*-android-arm64-v8a.apk"))
          names = set(zipfile.ZipFile(apk).namelist())
          missing = [p.relative_to(ext).as_posix() for p in ext.rglob("*") if p.is_file() and not p.name.startswith(".")
                     and p.relative_to(ext).parts[0] != "ios"
                     and f"assets/extensions/akhi/{p.relative_to(ext).as_posix()}" not in names]
          print(f"{apk.name}: {len(names)} files, {len(missing)} extension files missing {missing[:10]}")
          raise SystemExit(1 if missing else 0)
          PY

      - name: Upload to a private draft release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AKHI_SUBMODULES_TOKEN }}
        run: |
          df -h /
          mkdir -p artifacts out
          tar -C artifacts --exclude release-extension --exclude 'play-*' -cJf build-logs.tar.xz .
          files=(build-logs.tar.xz)
          for f in out/*; do [ -f "$f" ] && files+=("$f"); done
          gh release create "android-build-${{ github.run_id }}-${{ github.run_attempt }}" "${files[@]}" \
            --repo halgurdh/akhi-extension --draft --title "Android build ${{ github.run_id }}" \
            --notes "Signed with a throwaway key (not installable over the real app), from ${{ inputs.ref || github.sha }}: ${{ job.status }}"
